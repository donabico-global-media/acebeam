name: GEMINI-API-KEY

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy-gemini-bridge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Gemini API Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python Modules/Gemini-API-Key.py

      - name: Auto Commit and Push Gemini Bridge JS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Bridges/Gemini-API-Key.js
          
          if ! git diff --staged --quiet; then
            git commit -m "build(eseb): auto-generate Gemini-API-Key.js via Gemini Engine [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected in Bridges/Gemini-API-Key.js. Skipping commit."
          fi
