name: "FILTER BOT AI PROTOCOL"

on:
  schedule:
    - cron: '0 */4 * * *'  # Tự động làm mới tường lửa 4 tiếng/lần
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eseb-filter-bot-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-firewall:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Filter Compiler
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -f "Modules/Filter-Bot-AI.py" ]; then
            python Modules/Filter-Bot-AI.py
          else
            echo "::error::Không tìm thấy Modules/Filter-Bot-AI.py!"
            exit 1
          fi

      - name: Auto-Merge Stash & Deploy JS Bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f "Bridges/Filter-Bot-AI.js" ]; then
            git stash
            git pull origin ${{ github.ref_name }} --rebase
            git stash pop || true
            git add Bridges/Filter-Bot-AI.js
            git commit -m "security(eseb): refresh bot filter core [skip ci]" || exit 0
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
          else
            echo "::error::Tệp Bridges/Filter-Bot-AI.js không được tạo ra!"
            exit 1
          fi
