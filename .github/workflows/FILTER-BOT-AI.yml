name: FILTER BOT AI PROTOCOL

on:
  schedule:
    - cron: '0 */4 * * *'  # Chu kỳ chuẩn 4 tiếng một lần tự động làm mới tường lửa
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eseb-filter-bot-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-firewall:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Filter Compiler
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -f "Modules/Filter-Bot-AI.py" ]; then
            python Modules/Filter-Bot-AI.py
          else
            echo "::error::Khong tim thay Modules/Filter-Bot-AI.py!"
            exit 1
          fi

      - name: Sync Firewall Core to Root
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          
          if [ -f "Bridges/Filter-Bot-AI.js" ]; then
            # BƯỚC ĐỒNG BỘ CHỐNG XUNG ĐỘT (GIT SOFT RESET)
            git fetch origin ${{ github.ref_name }}
            git reset --soft origin/${{ github.ref_name }}
            
            git add Bridges/Filter-Bot-AI.js
            
            if git diff --staged --quiet; then
              echo "[ESEB Security] Không có thay đổi trong Bridges/Filter-Bot-AI.js."
            else
              git commit -m "security(eseb): refresh bot filter core [skip ci]"
              git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
            fi
          else
            echo "::error::Tep cau noi Bridges/Filter-Bot-AI.js khong duoc tao ra!"
            exit 1
          fi
