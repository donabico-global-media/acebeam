# ==============================================================================
# WORKFLOW SPECIFICATION FILE: .github/workflows/AI-HANDSHAKE-COMPILER.yml
# ECOSYSTEM: EATHESEN V3000-Ω MASTER ECOSYSTEM
# BRAND IDENTITY: DONABICO GLOBAL MEDIA SYSTEM
# SEAL STAMP: V-STAMP-24
# ARCHITECTURE: ESEB LIVING ENGINE (DUAL-TRIGGER COMPILER)
# ==============================================================================

name: AI-HANDSHAKE-COMPILER

on:
  push:
    paths:
      - 'Protocols/Universal-AI-Bot-Handshake-SOTA.eseb'
  schedule:
    - cron: '0 */4 * * *' # TỰ ĐỘNG CHẠY 4 TIẾNG 01 LẦN (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
  workflow_dispatch: # KÍCH HOẠT NÚT "RUN WORKFLOW" THỦ CÔNG BẰNG TAY

jobs:
  build-ehc-living-entity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Create Bridges Directory
        run: mkdir -p Bridges

      - name: Execute ESEB Core Engine Export
        run: |
          node -e "
            const fs = require('fs');
            const esebPath = 'Protocols/Universal-AI-Bot-Handshake-SOTA.eseb';
            const outputPath = 'Bridges/Universal-AI-Bot-Handshake-SOTA.ehc';
            
            if (!fs.existsSync(esebPath)) {
              console.error('❌ Error: Tệp ' + esebPath + ' chưa tồn tại trong thư mục Protocols!');
              process.exit(1);
            }

            const esebContent = fs.readFileSync(esebPath, 'utf8');
            const ehcCodeMatch = esebContent.match(/ehc_executable_code_template:\s*\|([\s\S]*?)(?=\n[a-z_]+:|$)/);
            
            if (ehcCodeMatch) {
              const cleanEhcCode = ehcCodeMatch[1].trim();
              fs.writeFileSync(outputPath, cleanEhcCode);
              console.log('✅ ' + outputPath + ' successfully compiled.');
            } else {
              console.error('❌ Failed to extract EHC executable template from .eseb file.');
              process.exit(1);
            }
          "

      - name: Commit & Push Living Entity (.ehc)
        run: |
          git config --global user.name "ESEB-Engine-Bot"
          git config --global user.email "bot@donabico.com"
          git add Bridges/Universal-AI-Bot-Handshake-SOTA.ehc
          git commit -m "build(eseb): compile Universal-AI-Bot-Handshake-SOTA.ehc [V-STAMP-24]" || exit 0
          git push
