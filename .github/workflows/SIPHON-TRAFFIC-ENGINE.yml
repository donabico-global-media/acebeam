name: SIPHON-TRAFFIC-ENGINE

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-siphon-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Kéo toàn bộ lịch sử Git để tránh xung đột branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Dynamic Siphon Traffic Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python Modules/Siphon-Traffic-Engine.py

      - name: Commit & Push Brand Repository Assets
        run: |
          git config --global user.name "EATHESEN-BOT"
          git config --global user.email "bot@donabico.com"
          git add Bridges/Siphon-Traffic-Engine.js Data/eseb_feed.xml
          git commit -m "update: Brand Repositories ESEB Assets" || exit 0
          git pull --rebase origin main
          git push origin main
