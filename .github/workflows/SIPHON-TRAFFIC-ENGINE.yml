name: SIPHON-TRAFFIC-ENGINE

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-siphon-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Dynamic Siphon Traffic Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python Modules/Siphon-Traffic-Engine.py

      - name: Commit & Push Brand Repository Assets
        run: |
          git config --global user.name "EATHESEN-BOT"
          git config --global user.email "bot@donabico.com"

          # 1. Đồng bộ remote URL chính xác
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin ${{ github.ref_name }}

          # 2. Reset soft về HEAD của Remote để giữ nguyên file Python mới tạo
          git reset --soft "origin/${{ github.ref_name }}"

          # 3. Add và Commit
          git add Bridges/Siphon-Traffic-Engine.js Data/eseb_feed.xml
          git commit -m "update: Brand Repositories ESEB Assets [skip ci]" || exit 0

          # 4. Push an toàn lên nhánh chính
          git push origin "HEAD:${{ github.ref_name }}"
