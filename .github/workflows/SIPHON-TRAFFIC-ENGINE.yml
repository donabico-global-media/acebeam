name: SIPHON-TRAFFIC-ENGINE

on:
  schedule:
    - cron: '0 */4 * * *'  # Tự động chạy mỗi 4 giờ
  workflow_dispatch:        # Kích hoạt chạy thủ công từ GitHub Actions UI

jobs:
  run-siphon-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Kéo toàn bộ lịch sử Git để xử lý đồng bộ mượt mà

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Dynamic Siphon Traffic Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python Modules/Siphon-Traffic-Engine.py

      - name: Commit & Push Brand Repository Assets
        run: |
          git config --global user.name "EATHESEN-BOT"
          git config --global user.email "bot@donabico.com"

          # 1. Đồng bộ Remote branch mà không làm mất tài sản mới do Python vừa sinh ra
          git fetch origin main
          git reset --soft origin main

          # 2. Đưa các tài sản tự động vào Staging Area
          git add Bridges/Siphon-Traffic-Engine.js Data/eseb_feed.xml

          # 3. Commit nếu có thay đổi mới
          git commit -m "update: Brand Repositories ESEB Assets [skip ci]" || exit 0

          # 4. Push trực tiếp lên main mà không bị chặn xung đột
          git push origin main
