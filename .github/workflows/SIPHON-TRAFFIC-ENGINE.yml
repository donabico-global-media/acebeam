name: SIPHON-TRAFFIC-ENGINE

on:
  schedule:
    - cron: '0 */4 * * *'  # Tự động vận hành 4 tiếng / 1 lần 24/7
  workflow_dispatch:        # Cho phép chạy thủ công bất kỳ lúc nào

jobs:
  run-siphon-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Dynamic Siphon Traffic Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python Modules/Siphon-Traffic-Engine.py

      - name: Commit & Push JS Bridge Asset Only
        run: |
          git config --global user.name "EATHESEN-BOT"
          git config --global user.email "bot@donabico.com"

          # Synchronize Remote Branch safely
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin ${{ github.ref_name }}
          git reset --soft "origin/${{ github.ref_name }}"

          # Add and Commit ONLY the single JS asset
          git add Bridges/Siphon-Traffic-Engine.js
          git commit -m "update: Pure ESEB JS Bridge [skip ci]" || exit 0

          # Push back to main branch
          git push origin "HEAD:${{ github.ref_name }}"
