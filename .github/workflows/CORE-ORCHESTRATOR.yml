name: CORE-ORCHESTRATOR

on:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: eseb-orchestrator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚙️ Execute Core Engine (Generate JS Bridge)
        run: |
          mkdir -p "Super Core Affiliate" "Bridges" "Protocols"
          python "Super Core Affiliate/Super-Core-Affiliate.py"

      - name: 🚀 Commit & Push Bridges/Super-Core-Affiliate.js
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Bridges/Super-Core-Affiliate.js
          
          if git diff --staged --quiet; then
            echo "[ESEB] No compiled asset changes detected."
          else
            git commit -m "build(eseb): auto-compile Bridges/Super-Core-Affiliate.js [skip ci]"
            
            # Đồng bộ lịch sử commit mới nhất từ origin/main để chống xung đột push
            git pull origin main --rebase || git rebase --skip
            
            git push origin main
          fi

      - name: 🌐 Deploy Assets to GitHub Pages CDN
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
