name: AI-SYSTEM-SIPHON

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-broadcast-yocto-siphon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Yocto AI Engine & Direct Broadcast
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python Modules/AI-System-Siphon.py

      - name: Auto Commit, Push and Signal Dispatch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Bridges/AI-System-Siphon.js
          
          if ! git diff --staged --quiet; then
            git commit -m "build(yocto): auto-generate AI-System-Siphon.js & broadcast signals [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes detected in Bridges/AI-System-Siphon.js. Skipping commit."
          fi
