name: GOOGLE DISPLAY PROTOCOL

on:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eseb-display-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrate-display:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚙️ Execute Display Compiler
        run: |
          mkdir -p Modules Bridges
          if [ -f "Modules/Google-Display.py" ]; then
            python Modules/Google-Display.py
            ls -la Bridges/
          else
            echo "::error::Modules/Google-Display.py not found!"
            exit 1
          fi

      - name: 🚀 Commit and Push Display Bridge
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Đồng bộ thông tin Remote
          git fetch origin ${{ github.ref_name }}
          
          mkdir -p Bridges
          
          if [ -f "Bridges/Google-Display.js" ]; then
            # 2. Kiểm tra nếu file JS tạo ra trùng khớp 100% với file đang có trên Remote thì bỏ qua
            if git diff origin/${{ github.ref_name }} -- Bridges/Google-Display.js --quiet; then
              echo "[ESEB DISPLAY] Bridges/Google-Display.js đã đồng bộ hoàn toàn với remote. Bỏ qua commit."
            else
              git add Bridges/Google-Display.js
              git commit -m "build(eseb-display): deploy isolated google display bridge [skip ci]"
              
              # 3. Rebase tự động giải quyết conflict bằng cách giữ lại bản biên dịch mới nhất từ Runner (-X ours)
              git pull origin ${{ github.ref_name }} --rebase -X ours || true
              
              # 4. Push lên Remote
              git push origin HEAD:${{ github.ref_name }}
            fi
          else
            echo "::error::Bridges/Google-Display.js does not exist!"
            exit 1
          fi
