      - name: 🚀 Commit & Push Display Bridge
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Đảm bảo thư mục Bridges tồn tại
          mkdir -p Bridges
          
          # Chỉ add nếu file tồn tại
          if [ -f "Bridges/Google-Display.js" ]; then
            git add Bridges/Google-Display.js
            
            # Nếu không có thay đổi nào mới thì bỏ qua mượt mà chứ không báo lỗi đỏ (exit 0)
            if git diff --staged --quiet; then
              echo "[ESEB DISPLAY] File JS Bridge không có thay đổi mới. Bỏ qua bước Commit."
            else
              git commit -m "build(eseb-display): deploy isolated google display bridge [skip ci]"
              git push origin HEAD:${{ github.ref_name }}
            fi
          else
            echo "::error::File Bridges/Google-Display.js không tồn tại sau khi chạy Python!"
            exit 1
          fi
