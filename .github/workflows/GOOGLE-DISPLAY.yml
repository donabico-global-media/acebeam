name: GOOGLE DISPLAY PROTOCOL

on:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  orchestrate-display:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚙️ Execute Display Compiler
        run: |
          mkdir -p Modules Bridges
          if [ -f "Modules/Google-Display.py" ]; then
            python Modules/Google-Display.py
            ls -la Bridges/
          else
            echo "::error::Modules/Google-Display.py not found!"
            exit 1
          fi

      - name: 🚀 Dedicated Commit and Push Google-Display.js
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f "Bridges/Google-Display.js" ]; then
            # 1. Cất file vừa tạo vào Stash để không bị đè khi Pull
            git stash --include-untracked
            
            # 2. Đồng bộ nhánh mới nhất từ Remote
            git pull origin ${{ github.ref_name }} --rebase
            
            # 3. Lấy file từ Stash ra lại
            git stash pop || true
            
            # 4. Stage, Commit và Push an toàn
            git add -f Bridges/Google-Display.js
            if git commit -m "build(display): auto-deploy Bridges/Google-Display.js [skip ci]"; then
              git push origin HEAD:${{ github.ref_name }}
              echo "✅ [SUCCESS] Đã Commit & Push thành công Bridges/Google-Display.js lên GitHub!"
            else
              echo "⚠️ [NOTICE] Không có thay đổi nào trong Bridges/Google-Display.js."
            fi
          else
            echo "::error::Bridges/Google-Display.js không tồn tại!"
            exit 1
          fi
