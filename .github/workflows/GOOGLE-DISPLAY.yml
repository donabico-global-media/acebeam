name: GOOGLE DISPLAY PROTOCOL

on:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  orchestrate-display:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚙️ Execute Display Compiler
        run: |
          mkdir -p Modules Bridges
          if [ -f "Modules/Google-Display.py" ]; then
            python Modules/Google-Display.py
            ls -la Bridges/
          else
            echo "::error::Modules/Google-Display.py not found!"
            exit 1
          fi

      - name: 🚀 Dedicated Commit and Push Google-Display.js
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Kéo dữ liệu mới nhất từ remote tránh xung đột rebase
          git pull origin ${{ github.ref_name }} --rebase || true
          
          if [ -f "Bridges/Google-Display.js" ]; then
            git add -f Bridges/Google-Display.js
            git commit -m "build(display): force deploy Bridges/Google-Display.js [skip ci]" || echo "No changes to commit"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ [SUCCESS] Đã ép Commit thành công Bridges/Google-Display.js!"
          else
            echo "::error::Bridges/Google-Display.js không tồn tại sau khi chạy Python!"
            exit 1
          fi
