name: GOOGLE DISPLAY PROTOCOL

on:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eseb-display-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrate-display:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Display Compiler
        run: |
          mkdir -p Modules Bridges
          if [ -f "Modules/Google-Display.py" ]; then
            python Modules/Google-Display.py
            ls -la Bridges/
          else
            echo "Error: Modules/Google-Display.py not found!"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p Bridges
          
          if [ -f "Bridges/Google-Display.js" ]; then
            git add Bridges/Google-Display.js
            
            if git diff --staged --quiet; then
              echo "No changes in Google-Display.js. Skipping commit."
            else
              git commit -m "build(eseb-display): deploy isolated google display bridge [skip ci]"
              git push origin HEAD:${{ github.ref_name }}
            fi
          else
            echo "Error: Bridges/Google-Display.js does not exist!"
            exit 1
          fi
