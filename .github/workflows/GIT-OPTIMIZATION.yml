name: "GIT-OPTIMIZATION"

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    # Chạy tự động lúc 00:00 UTC Chủ Nhật hàng tuần
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  eseb-git-optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tải toàn bộ history để xử lý triệt để

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Python Core Engine
        run: python Modules/Git-Optimization.py

      - name: Purge Actions Cache
        uses: actions/github-script@v7
        with:
          script: |
            console.log("Đang quét và xóa toàn bộ bộ nhớ đệm Actions cũ...");
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            for (const cache of caches.data.actions_caches) {
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id,
              });
            }

      - name: Run Git Garbage Collection & Aggressive Prune
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git reflog expire --expire=now --all
          git gc --prune=now --aggressive

      - name: Auto-Merge Stash & Deploy JS Bridge
        run: |
          git stash
          git pull origin ${{ github.ref_name }} --rebase
          git stash pop || true
          git add Bridges/Git-Optimization.js
          git commit -m "⚡ [ESEB AUTO-COMPILER] Updated Bridges/Git-Optimization.js [skip ci]" || exit 0
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
