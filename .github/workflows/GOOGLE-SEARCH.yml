name: GOOGLE SEARCH PROTOCOL

on:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eseb-search-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrate-search:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚙️ Execute Search Compiler
        run: |
          mkdir -p Modules Bridges
          if [ -f "Modules/Google-Search.py" ]; then
            python Modules/Google-Search.py
          else
            echo "::error::Không tìm thấy Modules/Google-Search.py!"
            exit 1
          fi

      - name: 🚀 Commit & Push Search Bridge
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Đồng bộ lịch sử commit với remote
          git fetch origin ${{ github.ref_name }}
          git reset --soft origin/${{ github.ref_name }}
          
          if [ -f "Bridges/Google-Search.js" ]; then
            git add Bridges/Google-Search.js
            
            if git diff --staged --quiet; then
              echo "[ESEB] Dữ liệu Google-Search.js trùng khớp, không có thay đổi mới."
            else
              git commit -m "seo(eseb): refresh organic search bridge [skip ci]"
              git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
            fi
          else
            echo "::error::Tệp Bridges/Google-Search.js không tồn tại!"
            exit 1
          fi
