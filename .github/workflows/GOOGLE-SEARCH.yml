name: GOOGLE SEARCH PROTOCOL

on:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eseb-search-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrate-search:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚙️ Execute Search Compiler
        run: |
          mkdir -p Modules Bridges
          if [ -f "Modules/Google-Search.py" ]; then
            python Modules/Google-Search.py
          else
            echo "::error::Không tìm thấy Modules/Google-Search.py!"
            exit 1
          fi

      - name: 🚀 Commit & Push Search Bridge
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p Bridges
          
          if [ -f "Bridges/Google-Search.js" ]; then
            git add Bridges/Google-Search.js
            
            if git diff --staged --quiet; then
              echo "⚠️ [ESEB] Dữ liệu Google-Search.js không đổi. Bỏ qua Commit."
            else
              git commit -m "seo(eseb): auto-compile organic search bridge & merchant schema [skip ci]"
              git pull --rebase origin ${{ github.ref_name }}
              git push origin ${{ github.ref_name }}
              echo "✅ [ESEB] Google-Search.js đã được Commit & Push thành công!"
            fi
          else
            echo "::error::Tệp Bridges/Google-Search.js không tồn tại!"
            exit 1
          fi
