name: YAHOO SEARCH PROTOCOL

on:
  schedule:
    - cron: '0 */6 * * *'  # Chạy định kỳ 6 tiếng/lần
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eseb-yahoo-search-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrate-yahoo-search:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Required Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: ⚙️ Execute Yahoo Search Engine
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          TARGET_INDEX_HTML: "index.html"
        run: |
          if [ -f "Modules/Yahoo-Search.py" ]; then
            python Modules/Yahoo-Search.py
          else
            echo "::error::Không tìm thấy Modules/Yahoo-Search.py!"
            exit 1
          fi

      - name: 🚀 Commit & Deploy Yahoo Sentinel and Bridge
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin ${{ github.ref_name }}
          git reset --soft origin/${{ github.ref_name }}
          
          # Thêm tệp Bridge và file HTML đã inject Sentinel
          git add Bridges/Yahoo-Search.js index.html
          
          if git diff --staged --quiet; then
            echo "[ESEB] Không có thay đổi trong Yahoo Bridge hoặc index.html."
          else
            git commit -m "build(eseb): compile Yahoo-Search.js bridge & inject sentinel [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
          fi
